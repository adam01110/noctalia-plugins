id = "adam0/forges"
name = "Forges"
version = "0.7.1"
plugin_api = 34
author = "Shangshui0302, Tangled contributors, Adam0"
license = "MIT"
icon = "git-branch"
description = "Cached Tangled, GitHub, and GitLab work queues with interactive native monthly activity, GitHub notifications, and GitLab to-dos."
tags = ["bar", "panel", "service", "development", "productivity"]
dependencies = ["tg", "gh", "glab", "curl", "xdg-open"]

[[setting]]
key = "provider"
type = "select"
label_key = "settings.provider"
default = "tangled"
options = [
  { value = "tangled", label_key = "settings.tangled" },
  { value = "github", label_key = "settings.github" },
  { value = "gitlab", label_key = "settings.gitlab" },
]

[[setting]]
key = "gitlab_url"
type = "string"
label_key = "settings.gitlab_url"
default = "https://gitlab.com"

[[setting]]
key = "refresh_interval_minutes"
type = "int"
label_key = "settings.refresh"
default = 15
min = 5
max = 60

[[widget]]
id = "forges"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 580
height = 800
placement = "floating"
position = "auto"
open_near_click = true

[[service]]
id = "sync"
entry = "service.luau"
