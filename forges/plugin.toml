id = "adam0/forges"
name = "Forges"
version = "0.3.1"
plugin_api = 34
author = "Shangshui0302, Adam0"
license = "MIT"
icon = "git-branch"
description = "Tangled and GitHub workspaces with cached queues, contribution history, and a read-only GitHub inbox."
tags = ["bar", "panel", "service", "development", "productivity"]
dependencies = ["tg", "gh", "xdg-open"]

[[setting]]
key = "provider"
type = "select"
label_key = "settings.provider"
default = "tangled"
options = [
  { value = "tangled", label_key = "settings.tangled" },
  { value = "github", label_key = "settings.github" },
]

[[setting]]
key = "refresh_interval_minutes"
type = "int"
label_key = "settings.refresh"
default = 15
min = 5
max = 60

[[widget]]
id = "forges"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 580
height = 600
placement = "floating"
position = "auto"
open_near_click = true

[[service]]
id = "sync"
entry = "service.luau"
