id = "adam0/albedo-monitor"
name = "Albedo Monitor"
version = "0.1.0"
plugin_api = 34
author = "adam0"
license = "MIT"
icon = "robot"
description = "Albedo daemon sessions, agents, and account quota."
tags = ["ai", "bar", "panel", "service", "utility"]
dependencies = ["albedo-monitor", "timeout"]

[[setting]]
key = "monitorPath"
type = "string"
label_key = "settings.monitor_path.label"
description_key = "settings.monitor_path.description"
default = "albedo-monitor"

[[setting]]
key = "refreshIntervalSec"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 60
min = 2
max = 300

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "status"
entry = "status.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 480
height = 640
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
